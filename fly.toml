# fly.toml app configuration file generated for acsm-converter-fly on 2026-05-11T21:33:25Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'acsm-converter-fly'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
